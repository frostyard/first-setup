name: Release

# A version tag (vX.Y.Z, pushed by `just bump`) builds snow-first-setup,
# attests it, creates the GitHub release, and asks frostyard/apt-publisher to
# publish it. apt-publisher is the only writer of the Debian repository
# (frostyard/core ADR-0055); after the package is installable it dispatches
# `build` to frostyard/snosi (ADR-0056). tests/test_workflows.py pins this.
on:
  push:
    tags:
      # Only version tags. The `continuous` prerelease tag from build.yml must
      # never start a release.
      - "v*"

permissions: {}

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    # debian:trixie matches the target distro (snosi images are Trixie-based).
    # ghcr.io/frostyard/snow:latest can no longer be used as a job container:
    # snosi CI re-chunks published images into 100+ layers for efficient delta
    # updates, and Docker refuses to pull them ("max depth exceeded" — the
    # ~128-layer overlay2 limit). Podman/bootc hosts are unaffected.
    container:
      image: debian:trixie
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y dpkg-dev devscripts
          apt-get build-dep -y .

      # apt-publisher refuses different bytes under a version it already
      # serves, so a tag must build the version debian/changelog names
      # (`just bump` writes both).
      - name: Check the tag matches debian/changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(dpkg-parsechangelog -SVersion)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match debian/changelog version $version"
            exit 1
          fi

      - name: Set meson version by tag
        env:
          TAG: ${{ github.ref_name }}
        run: sed -i "s/VTESTING/$TAG/g" meson.build

      # apt-publisher publishes every .deb attached to the release under its
      # file name, so attach exactly one, named name_version_arch.deb.
      - name: Build .deb package
        env:
          EMAIL: bketelsen@gmail.com
        run: |
          dpkg-buildpackage
          version=$(dpkg-parsechangelog -SVersion)
          mkdir -p dist
          mv ../snow-first-setup_*.deb dist/
          if [ "$(ls dist)" != "snow-first-setup_${version}_all.deb" ]; then
            echo "::error::expected only snow-first-setup_${version}_all.deb, got: $(ls dist)"
            exit 1
          fi
          (cd dist && sha256sum -- *.deb > checksums.txt)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: first-setup
          path: dist/
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build-artifacts
    permissions:
      contents: write # to create the release and upload its assets
      attestations: write # to store the build-provenance attestation
      id-token: write # to mint the OIDC token the attestation is signed with

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: first-setup
          path: dist

      # Binds each asset to this run at refs/tags/<tag>. apt-publisher checks
      # it with `gh attestation verify --source-ref refs/tags/<tag>` before
      # publishing. Attested before the release exists, so no release is ever
      # created without provenance.
      - name: Attest Release Files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/checksums.txt

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes dist/*.deb dist/checksums.txt

  # A job of its own, so that a failed request can be retried with "Re-run
  # failed jobs" without recreating the release.
  request-publication:
    runs-on: ubuntu-latest
    needs: release
    permissions: {}

    steps:
      # The .deb is published by frostyard/apt-publisher, the single Debian
      # writer (frostyard/core ADR-0055). It downloads this release's .deb
      # assets, verifies their provenance, publishes them to trixie, and then
      # dispatches `build` to frostyard/snosi once they are installable
      # (ADR-0056). Not continue-on-error: if this request fails, nothing was
      # published and the release run must fail.
      - name: Request APT publication
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.APT_PUBLISH_TOKEN }}
          repository: frostyard/apt-publisher
          event-type: publish-deb
          client-payload: '{"repo": "${{ github.repository }}", "tag": "${{ github.ref_name }}"}'
