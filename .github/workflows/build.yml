name: Build

on:
  push:
    branches: ["main"]
  pull_request:
# Nothing here uses the workflow token for writes: the continuous prerelease
# is published with ORG_PAT.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # debian:trixie matches the target distro (snosi images are Trixie-based).
    # ghcr.io/frostyard/snow:latest can no longer be used as a job container:
    # snosi CI re-chunks published images into 100+ layers for efficient delta
    # updates, and Docker refuses to pull them ("max depth exceeded" — the
    # ~128-layer overlay2 limit). Podman/bootc hosts are unaffected.
    container:
      image: debian:trixie

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0 # Important: Need full history for gbp dch

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y git-buildpackage devscripts lintian python3-yaml
          apt-get build-dep -y .

      - name: Check workflow contracts
        run: python3 -B -m unittest discover -s tests -v

      - name: Build .deb package
        run: |
          dpkg-buildpackage
          mv ../snow-first-setup_*.deb snow-first-setup.deb

      - name: Calculate and Save Checksums
        run: |
          sha256sum snow-first-setup.deb >> checksums.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snow-first-setup
          path: |
            checksums.txt
            snow-first-setup.deb

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: github.ref == 'refs/heads/main'
        with:
          token: "${{ secrets.ORG_PAT }}"
          tag_name: "continuous"
          prerelease: true
          name: "Continuous Build"
          files: |
            checksums.txt
            snow-first-setup.deb
